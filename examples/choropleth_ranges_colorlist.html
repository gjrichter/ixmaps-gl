<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CHOROPLETH · RANGES · color list</title>
<script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-gl@v0.2.46/ixmaps-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 340px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>CHOROPLETH · RANGES · color list</b>
  <span>Explicit ranges 0-10-20-30-40 with a plain list of four colors: each range gets its own color,
    red, green, blue, yellow — not a sweep from the first color to the last.</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  // inline data: four squares in a row, one value per range
  var values = [5, 15, 25, 35];
  var squares = { type: "FeatureCollection", features: values.map(function (v, i) {
    var x = 9.0 + i * 0.12, y = 45.4, d = 0.05;
    return { type: "Feature", properties: { v: v, name: "range " + (i + 1) },
      geometry: { type: "Polygon", coordinates: [[[x - d, y - d], [x + d, y - d], [x + d, y + d], [x - d, y + d], [x - d, y - d]]] } };
  }) };
  var theme = ixmaps.layer("squares", layer => layer
    .data({ obj: squares, type: "geojson" })
    .binding({ geo: "geometry", value: "v", title: "name" })
    .type("FEATURE|CHOROPLETH|RANGES")
    .style({ ranges: [0, 10, 20, 30, 40], colorscheme: ["#ff0000", "#00ff00", "#0000ff", "#ffff00"], fillopacity: 0.8 })
    .meta({ title: "ranges with a color list", tooltip: "{{name}}: {{v}}" })
  );
  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.4, 9.18], 10).layer(theme)
  );
</script>
</body>
</html>
