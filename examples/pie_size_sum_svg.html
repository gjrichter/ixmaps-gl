<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PIE · SIZE|SUM</title>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@1/ixmaps.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 320px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>PIE · SIZE|SUM</b>
  <span>The most used real pie type, CHART|PIE|SIZE|SUM|SIMPLELEGEND: one pie per comune, placed on its FEATURE base polygon via binding.lookup, slices = four 2024 age-band shares (0-4 and 80-84, male/female), pie size = total population. Flat twin: pie_size_sum_svg.html.</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  var GEO_URL  = "https://raw.githubusercontent.com/gjrichter/geo/0153a0e14da5dae877b8c94d6deb11f210d4660a/italy/boundaries/italy_istat_municipalities_4326_500m.topojson";
  var DATA_URL = "https://raw.githubusercontent.com/gjrichter/ixmaps-data/main/by-project/italy-comuni-demographics/comuni_population_by_age_sex_v3.csv";

  var base = ixmaps.layer("comuni", layer => layer
    .data({ url: GEO_URL, type: "topojson" })
    .binding({ geo: "geometry", id: "com_istat_code_num", title: "name" })
    .type("FEATURE")
    .style({ colorscheme: ["#e9e9e9"], fillopacity: 0.4, linecolor: "#aaaaaa", linewidth: 0.15 })
  );

  var pies = ixmaps.layer("comuni", layer => layer
    .data({ url: DATA_URL, type: "csv", name: "popData", cache: "true" })
    .binding({
      lookup: "comune_code",
      value: "2024_0-4_male|2024_0-4_female|2024_80-84_male|2024_80-84_female",
      size: "2024_total_pop"
    })
    .type("CHART|PIE|SIZE|SUM|SIMPLELEGEND")
    .style({
      colorscheme: ["4", "tableau10"],
      label: ["0-4 male", "0-4 female", "80-84 male", "80-84 female"],
      units: "%",
      scale: "4",
      showdata: "true"
    })
    .meta({
      title: "Age-band shares 2024, sized by population",
      tooltip: "<b>{{comune_name}}</b> ({{provincia}})<br>{{theme.item.chart}}"
    })
  );

  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.3, 8.6], 8)
      // flat's default object scaling (charts keep their screen size); gl's own default is "dynamic"
      .options({ objectscaling: "true" })
      .layer(base).layer(pies)
  );
</script>
</body>
</html>
