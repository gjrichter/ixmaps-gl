<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BOX · TITLE · SEQUENCE</title>
<script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-gl@v0.2.0/ixmaps-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 340px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>BOX · TITLE · SEQUENCE</b>
  <span>A multi-field SEQUENCE symbol chart with its box and title: rectangular box, circular box with a bottom title, DTEXT, and a small, untitled, widely spaced layer whose charts do not overlap (one band).</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  // inline data: six items per layer, a row of layers one above the other
  function items(lat0, dx) {
    var rows = [["Alpha", 9, 4, 2, 30], ["Beta, long name that wraps", 3, 8, 1, 55], ["Gamma", 6, 6, 6, 20],
                ["Delta", 1, 2, 9, 70], ["Epsilon", 7, 1, 3, 45], ["Zeta", 4, 5, 8, 90]];
    return { type: "FeatureCollection", features: rows.map(function (r, i) { return {
      type: "Feature", properties: { name: r[0], a: r[1], b: r[2], c: r[3], n: r[4] },
      geometry: { type: "Point", coordinates: [9.05 + i * (dx || 0.07), lat0] } }; }) };
  }
  function themeAt(name, lat0, type, binding, style, dx) {
    return ixmaps.layer(name, layer => layer
      .data({ obj: items(lat0, dx), type: "geojson" })
      .binding(Object.assign({ geo: "geometry", title: "name" }, binding))
      .type(type)
      .style(Object.assign({ colorscheme: ["#e8a33d", "#3d8be8", "#5bb55b"], scale: "2", showdata: "true" }, style || {}))
      .meta({ title: name, tooltip: "<b>{{name}}</b>" })
    );
  }
  var L0 = themeAt("seq-rect", 45.5, "CHART|SYMBOL|SEQUENCE|STAR|BOX|TITLE", { value: "a|b|c" });
  var L1 = themeAt("seq-circular", 45.4, "CHART|SYMBOL|SEQUENCE|STAR|BOX|CIRCULARBOX|TITLE|BOTTOMTITLE", { value: "a|b|c" });
  var L2 = themeAt("seq-dtext", 45.3, "CHART|SYMBOL|SEQUENCE|STAR|BOX|CIRCULARBOX|TITLE|DTEXT", { value: "a|b|c", size: "n" }, { textscale: "1.5", boxopacity: "0.6" });
  var L3 = themeAt("seq-sparse", 45.2, "CHART|SYMBOL|SEQUENCE|STAR|BOX", { value: "a|b|c" }, { scale: "0.3" }, 0.3);
  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.4, 9.2], 10)
      .layer(L0)
      .layer(L1)
      .layer(L2)
      .layer(L3)
  );
</script>
</body>
</html>
