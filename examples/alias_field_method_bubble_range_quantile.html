<!DOCTYPE html>
<html>
<head>
<!-- equivalence twin of bubble_range_quantile.html: value given with .field() instead of binding value — the regression harness requires identical output -->
<meta charset="utf-8">
<title>BUBBLE · range (QUANTILE)</title>
<script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-gl@v0.1.0/ixmaps-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 320px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>BUBBLE · range (QUANTILE)</b>
  <span>FERITI classed into 5 equal-COUNT buckets. On this skewed dataset (mostly FERITI=1) several buckets collapse to the same value range — a real quirk of the classification, not a bug.</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  var __layer = ixmaps.layer("AREU", layer => layer
    .data({ url: "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/AREU/ISTAT_2019_2023.topojson.gz", type: "topojson" })
    .type("CHART|SYMBOL|GLOW|AGGREGATE|COUNT|RELOCATE|VALUES|QUANTILE")
    .binding({ position: "geometry", size: "FERITI" })
    .field("FERITI")
    .style({
      colorscheme: ["#ffffb2","#fecc5c","#fd8d3c","#f03b20","#bd0026"],
      classes: "5",
      valuedecimals: "0",
      normalsizevalue: "50",
      aggregation: ["1:1", "3px", "1:500000", "1px"]
    })
    .meta({ title: "BUBBLE · range (QUANTILE)", tooltip: "<b>{{theme.title}}</b><br>{{theme.item.chart}}" })
  );

  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.4642, 9.19], 12.5)
      .options({ objectscaling: "dynamic", normalSizeScale: "259302", dynamicScalePow: "3" })
      .layer(__layer)
  );
</script>
</body>
</html>
