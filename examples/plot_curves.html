<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PLOT · per-year curves (GRIDSIZE)</title>
<script src="../ixmaps-engine.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 340px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>PLOT · per-year curves (GRIDSIZE)</b>
  <span>Points binned into a spatial grid; each cell renders a mini line+area chart of FERITI across 2019/2020/2021 (verbatim config from the original page's "incidenti/feriti per anno" toggle).</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  // ---------------------------------------------------------------
  // Layer configs copied VERBATIM from the original page
  // (index_embed_ISTAT_incidenti_NATURA_2019_2022_simple_VT_KDE.html),
  // __incidenti_curves_years and __incidenti_curves_grid.
  // ---------------------------------------------------------------

  var __incidenti_curves_years =
    ixmaps.layer("Mercator", layer => layer
      .data({ name: "themeDataObj", url: "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/AREU/ISTAT_2019_2023.topojson.gz", type: "topojson", cache: "true" })
      .binding({ position: "geometry", value: "ANNO", size: "FERITI" })
      .type("CHART|SYMBOL|PLOT|LINES|AREA|LASTARROW|CATEGORICAL|BOX|XAXIS|FIXSIZE|GRIDSIZE|ZEROISVALUE|AGGREGATE|RECT|SUM|NOSORT|NOLEGEND")
      .style({
        name: "curves_incidenti",
        colorscheme: ["#666666"],
        fillopacity: "0.05",
        shadow: "true",
        values: ["2019", "2020", "2021"],
        label: ["2019", "2020", "2021"],
        xaxis: ["2019", "2020", "2021"],
        normalsizevalue: "20",
        scale: "1.0",
        rangescale: "1",
        linewidth: "1.5",
        markersize: "2",
        offsetx: "-12",
        offsety: "-10",
        boxopacity: "0.001",
        bordercolor: "none",
        valuescale: "1",
        gridwidthpx: "100"
      })
      .meta({
        title: "Numero dei feriti per anno",
        tooltip: "<b>{{theme.title}}</b><br>{{theme.item.chart}}",
        splash: "scaricando dati ..."
      })
    );

  var __incidenti_curves_grid =
    ixmaps.layer("AREU", layer => layer
      .data({ name: "themeDataObj", url: "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/AREU/ISTAT_2019_2023.topojson.gz", type: "topojson", cache: "true" })
      .binding({ position: "geometry", value: "ANNO" })
      .type("CHART|SYMBOL|SIZE|NOOUTLIER|ZEROISNOTVALUE|QUANTILE|AGGREGATE|RECT|MEAN|GRIDSIZE|NOLEGEND")
      .style({
        name: "grid",
        colorscheme: ["none"],
        symbols: ["square"],
        linecolor: ["black"],
        linewidth: ["0.2"],
        gridwidthpx: "100"
      })
      .meta({ title: "Incidenti Bergamo 2002-2024", splash: "scaricando dati ..." })
    );

  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.4642, 9.19], 12.5)
      .layer(__incidenti_curves_grid)
      .layer(__incidenti_curves_years)
  );
</script>
</body>
</html>
