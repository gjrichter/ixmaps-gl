<!DOCTYPE html>
<html>
<head>
<!-- equivalence twin of dot_categorical.html: style property fillopacity given in .meta() instead of .style() — the regression harness requires identical output -->
<meta charset="utf-8">
<title>DOT · CATEGORICAL</title>
<script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-gl@v0.1.0/ixmaps-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map_div { position: absolute; inset: 0; }
  #caption {
    position: absolute; top: 1em; left: 1em; z-index: 10; max-width: 320px;
    background: rgba(255,255,255,0.92); padding: 0.6em 1em; border-radius: 6px;
    font-size: 0.9em; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #caption b { display: block; margin-bottom: 0.2em; }
  #caption span { opacity: 0.75; }
  #back { display: inline-block; margin-top: 0.5em; font-size: 0.85em; }
</style>
</head>
<body>
<div id="map_div"></div>
<div id="caption">
  <b>DOT · CATEGORICAL</b>
  <span>One fixed-size dot per accident (no clustering, no value-driven size — the real engine's simplest symbol type), colored by NATURA_INC.</span><br>
  <a id="back" href="index.html">&larr; all examples</a>
</div>
<script>
  __setColors = objTheme => {
    for (i = 0; i < objTheme.szLabelA.length; i++) {
      if (objTheme.szLabelA[i].match(/investimento/i)) objTheme.colorScheme[i] = "#ff0088";
      else if (objTheme.szLabelA[i].match(/tamponamento/i)) objTheme.colorScheme[i] = "#0066cc";
      else if (objTheme.szLabelA[i].match(/scontro/i)) objTheme.colorScheme[i] = "#ddbb22";
      else objTheme.colorScheme[i] = "#00aaaa";
    }
  };

  var __layer = ixmaps.layer("AREU", layer => layer
    .data({ url: "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/AREU/ISTAT_2019_2023.topojson.gz", type: "topojson" })
    .type("DOT|CATEGORICAL")
    .binding({ position: "geometry", value: "NATURA_INC" })
    .style({ colorscheme: __setColors.toString() })
    .meta({ title: "DOT · CATEGORICAL", tooltip: "<b>{{theme.title}}</b><br>{{theme.item.chart}}", fillopacity: "0.8" })
  );

  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT" },
    map => map.view([45.4642, 9.19], 13).layer(__layer)
  );
</script>
</body>
</html>
