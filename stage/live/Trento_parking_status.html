		// fetch live capacity/freeslots/busy per id via data.js (handles CSV quoting)
		function loadParkingStatus() {
			return new Promise(function(resolve, reject) {
				Data.feed({
					source: "https://raw.githubusercontent.com/napo/parklogtrento/main/data/last_parks.csv",
					type: "csv"
				}).error(function(err) {
					reject(err);
				}).load(function(table) {
					resolve(table.json());
				});
			});
		}

		// ----------------------------------------------------------------
		// Trend arrows: compare the live current freeslots to a past
		// reading from the full parks.geoparquet history.
		//
		// Two things that don't work as the "previous" reference:
		// - our own poll cycle (60s): the source only updates every
		//   ~5-20 min, so two consecutive polls are usually identical.
		// - the LAST row in the history: the scraper appends to history
		//   at the same time it writes last_parks.csv, so the last
		//   historical row IS the current live reading (confirmed
		//   empirically -- delta was 0 for every single station).
		// - a single fixed lookback (tried 30 min): most stations are
		//   genuinely flat over any one short window -- confirmed only
		//   1 of 17 stations had moved in 30 min.
		// So: for each station, try 15 min ago, then 30 min, then 60 min,
		// and use the first of those that actually differs from the
		// current value -- i.e. look further back only until an actual
		// trend shows up, instead of committing to one arbitrary window.
		//
		// Loading the full history is ~15-20s (one-time per call, DuckDB
		// WASM parsing ~465k rows); do NOT call .subtable()/.getArray()/
		// .json() on the full table -- that freezes the tab. Pull single
		// columns via .column(name).values() instead (fast, <1s).
		// ----------------------------------------------------------------
		var TREND_LOOKBACKS_MS = [15 * 60000, 30 * 60000, 60 * 60000]; // 15min, 30min, 1h -- shortest first
		var HISTORY_WINDOW_MS = 90 * 60 * 1000; // must comfortably cover the longest lookback above
		var historicalFreeslotsById = {}; // id -> [free@15min, free@30min, free@1h]

		function loadParkingHistory() {
			return new Promise(function(resolve, reject) {
				Data.feed({
					source: "https://raw.githubusercontent.com/napo/parklogtrento/main/data/parks.geoparquet",
					type: "parquet"
				}).error(function(err) {
					reject(err);
				}).load(function(table) {
					var ids = table.column("id").values();
					var ts = table.column("timestamp").values();
					var free = table.column("freeslots").values();

					var now = Date.now();
					var windowStart = now - HISTORY_WINDOW_MS;
					var targets = TREND_LOOKBACKS_MS.map(function(ms) { return now - ms; });

					// per id: for each target, the latest reading at/before it; plus the
					// earliest reading in the window as a fallback for brand-new stations
					var bestById = {}, earliestById = {};
					for (var i = 0; i < ids.length; i++) {
						var tsStr = ts[i];
						if (tsStr.charCodeAt(0) === 34) tsStr = tsStr.slice(1, -1); // strip literal quotes
						var msVal = Date.parse(tsStr);
						if (!(msVal >= windowStart)) continue;
						var idNum = Number(ids[i]);
						var freeVal = Number(free[i]);

						if (!bestById[idNum]) bestById[idNum] = new Array(targets.length).fill(null);
						for (var k = 0; k < targets.length; k++) {
							if (msVal <= targets[k] && (!bestById[idNum][k] || msVal > bestById[idNum][k].ts)) {
								bestById[idNum][k] = { ts: msVal, free: freeVal };
							}
						}
						if (!(idNum in earliestById) || msVal < earliestById[idNum].ts) {
							earliestById[idNum] = { ts: msVal, free: freeVal };
						}
					}

					var result = {};
					Object.keys(earliestById).forEach(function(id) {
						var perTarget = bestById[id] || [];
						result[id] = targets.map(function(_, k) {
							return perTarget[k] ? perTarget[k].free : earliestById[id].free;
						});
					});
					resolve(result);
				});
			});
		}

		function loadParkingData() {
			return loadParkingStatus().then(function(status) {
				var statusById = {};
				status.forEach(function(s) { statusById[s.id] = s; });

				return PARKING_POSITIONS.map(function(p) {
					var s = statusById[p.id] || {};
					var currentFree = Number(s.freeslots) || 0;
					var candidates = historicalFreeslotsById[p.id];
					var prevFree = currentFree;
					if (candidates) {
						var differing = candidates.filter(function(v) { return v !== currentFree; });
						// first lookback (shortest) that actually differs; else the longest one (still flat -> no arrow)
						prevFree = differing.length ? differing[0] : candidates[candidates.length - 1];
					}
					return Object.assign({}, p, {
						capacity: Number(s.capacity) || 0,
						freeslots: currentFree,
						prevFreeslots: prevFree,
						busy: Number(s.busy) || 0,
						offline: s.offline === "True"
					});
				}).filter(function(p) { return !p.offline; });
			});
		}

		// static tariff-zone boundaries -- defined once, never refreshed, drawn
		// before the parking layers so the bubbles/arrows stay on top of them
		function renderZones(myMap) {
			var zoneColors = ["#0000ff", "#ffff00", "#ff0000", "#008000", "#5f5f5f", "#9a8161", "#474a51"];

			myMap.layer("Zones")
				.data({ obj: ZONES_GEOJSON, type: "geojson" })
				.binding({ geo: "geometry", value: "color", title: "name" })
				.type("FEATURE|CHOROPLETH|CATEGORICAL|TEXTLEGEND")
				.style({
					colorscheme: "#048",
					fillopacity: "0.2",
					linecolor: "#fff",
					linewidth: "1",
					showdata: "true"
				})
				.meta({
					name: "parking-zones",
					tooltip: "<b>{{name}}</b><br>Zona tariffaria auto<br>" +
						"<i>dato del 28/04/2025, non aggiornato</i><br>" +
						"capienza storica: {{capacity}}, liberi: {{freeslots}}"
				})
				.title("Trento - Zone tariffarie")
				.define();
		}

		// ----------------------------------------------------------------
		// define/replace the two "Parking" themes (position + status gauge)
		// same layer name "Parking" -> status overlay joins onto positions
		// stable meta.name -> re-running this auto-replaces IN PLACE, but only
		// if calls are spaced apart (the engine's removal is async internally;
		// two redefines fired within ~15-20s of each other race and duplicate
		// the theme instead of replacing it). Keep all redefines on the same
		// slow cadence (the 60s live-refresh tick) -- never call this twice
		// back-to-back.
		// ----------------------------------------------------------------
		function renderParking(myMap, records) {

			myMap.layer("Parking")
				.data({ obj: records, type: "json" })
				.binding({ geo: "lat|lon", id: "id", value: "freeslots", title: "name" })
				.type("FEATURE|CHOROPLETH|NOLEGEND")
				.style({
					colorscheme: ["#666"],
					shadow: "false",
					showdata: "true",
					scale: "1",
					valuescale: "1"
				})
				.meta({ name: "parking-position", tooltip: "<b>{{name}}</b><br>{{theme.item.chart}}" })
				.title("Parcheggi")
				.define();

			myMap.layer("Parking")
				.data({ obj: records, type: "json" })
				.filter('WHERE type == "park"')
				.binding({ lookup: "id", value: "busy|freeslots" })
				.type("GAUGE|CENTERVALUES|CHART|SYMBOL|SEQUENCE|CENTER|RINGS|SIZE|FAST|SUM|CIRCULARBOX|BOTTOMTITLE")
				.style({
					colorscheme: ["#c62828", "none"],
					fillopacity: "0.7",
					shadow: "false",
					showdata: "true",
					symbols: ["circle"],
					label: ["posti auto occupati", "posti auto liberi"],
					sizepow: "1.5",
					scale: "2",
					normalsizevalue: "150",
					linecolor: ["#c62828"],
					linewidth: "5",
					valuescale: "1",
					boxcolor: "none",
					titlefield: "name",
					textscale: 1.2,
					textcolor: "#000",	
					valuecolor: "#fdd",	
					fadenegative: "1"
				})
				.meta({ name: "parking-status-car", tooltip: "{{theme.item.chart}}{{theme.item.data}}" })
				.title("Trento - Parcheggi auto")
				.define();

			myMap.layer("Parking")
				.data({ obj: records, type: "json" })
				.filter('WHERE type == "bike"')
				.binding({ lookup: "id", value: "busy|freeslots" })
				.type("GAUGE|CENTERVALUES|CHART|SYMBOL|SEQUENCE|CENTER|RINGS|SIZE|FAST|SUM|CIRCULARBOX|BOTTOMTITLE")
				.style({
					colorscheme: ["#1565c0", "none"],
					fillopacity: "0.7",
					shadow: "false",
					showdata: "true",
					symbols: ["circle"],
					label: ["posti bici occupati", "posti bici liberi"],
					scale: "2",
					normalsizevalue: "150",
					linecolor: ["#1565c0"],
					linewidth: "5",
					valuescale: "1",
					boxcolor: "none",
					titlefield: "name",
					fadenegative: "1"
				})
				.meta({ name: "parking-status-bike", tooltip: "{{theme.item.chart}}{{theme.item.data}}" })
				.title("Trento - Rimessaggio bici")
				.define();

			// trend arrows: delta of freeslots vs the previous refresh (60s ago).
			// "a|b" binding order -> DIFFERENCE computes b-a; NONEGATIVE hides
			// the layer where that's <= 0, so exactly one of the two arrows
			// (or neither, on the very first load) shows per station.
			myMap.layer("Parking")
				.data({ obj: records, type: "json" })
				.binding({ lookup: "id", value: "prevFreeslots|freeslots", title: "name" })
				.type("CHART|USER|DIFFERENCE|NONEGATIVE|NOLEGEND")
				.style({
					userdraw: "arrowChart",
					colorscheme: ["#2e7d32", "#2e7d32"],
					rotation: 0,
					normalsizevalue: "5",
					scale: "1",
					showdata: "true"
				})
				.meta({ name: "parking-trend-up", tooltip: "<b>{{name}}</b><br>posti liberi in aumento" })
				.define();

			myMap.layer("Parking")
				.data({ obj: records, type: "json" })
				.binding({ lookup: "id", value: "freeslots|prevFreeslots", title: "name" })
				.type("CHART|USER|DIFFERENCE|NONEGATIVE|NOLEGEND")
				.style({
					userdraw: "arrowChart",
					colorscheme: ["#c62828", "#c62828"],
					rotation: 180,
					normalsizevalue: "5",
					scale: "1",
					showdata: "true"
				})
				.meta({ name: "parking-trend-down", tooltip: "<b>{{name}}</b><br>posti liberi in diminuzione" })
				.define();
		}

			center: {
				lat: "46.0679",
				lng: "11.1211"

			zoom: "14"
			})
		)
		.then(function(myMap) {

			// engine's async theme removal needs a gap before a safe redefine
			// (see renderParking). Tried applying history the moment it's ready
			// (with a 20s safety gap) -- still landed inside the risky window
			// often enough to duplicate themes again. Simpler and reliably safe:
			// history only ever gets APPLIED on the regular 60s tick below, which
			// is always 60s away from the previous render -- comfortably safe.
			function doRender(records) {
				renderParking(myMap, records);
			}

			// static zone boundaries -- defined once, drawn underneath everything else
			renderZones(myMap);

			// show current status right away, without waiting for the history load
			// (prevFreeslots falls back to currentFree until history resolves, so no arrows yet)
			loadParkingData().then(doRender);

			// history is a ~465k-row parquet -- one-time ~15-20s load, done in the
			// background. Cache only here -- the next 60s tick below applies it.
			loadParkingHistory().then(function(byId) {
				historicalFreeslotsById = byId;
			});

			// refresh live availability every minute (source updates every ~5-20 min, irregular)
			// -- also what applies a freshly (re)loaded historicalFreeslotsById
			setInterval(function() {
				loadParkingData().then(doRender);
			}, 60000);

			// refresh the historical reference every 20 minutes (expensive load; cache
			// only, same reasoning as above -- the live-refresh tick applies it)
			setInterval(function() {
				loadParkingHistory().then(function(byId) {
					historicalFreeslotsById = byId;
				});
			}, 20 * 60000);
		});
