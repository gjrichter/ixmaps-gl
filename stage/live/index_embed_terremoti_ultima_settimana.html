<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ixmaps embed example">
    <meta name="author" content="guenter richter">
    <link rel="shortcut icon" href="https://gjrichter.github.io/ixmaps/ui/resources/images/ixmaps_logo.png">

    <title>Data Viz Italia - Terremoti dell'ultima settimana</title>
    <meta name="description" content="Mappa interattiva dei terremoti della ultima settimana - fonte: INGV">

    <link rel="stylesheet" href="./css/site_wbgt.css">
                                                   
</head>

<body>

    <div class="logo" onclick="__dataTheme()" role="button" tabindex="0" aria-label="Mostra codice HTML">
        <div class="logo-text">
            Data<br>
            <span style="padding-left: 2px;">Viz</span>
            <em style="font-style: italic;"> i</em>
        </div>
    </div>

    <!-- size exponent: radius ~ value^(1/pow); small pow = magnitude scaled towards radiated energy -->
    <div id="sizepow_ctrl" style="position:absolute;z-index:9999;left:max(12px,calc(50% - 500px));bottom:56px;background:rgba(255,255,255,0.92);border:1px solid var(--line);border-radius:var(--r-ctrl);box-shadow:var(--sh-float);padding:10px 14px;width:200px;font-size:12px;color:var(--ink-2)">
        <nav class="seg" style="margin:0 0 10px 0" aria-label="Dimensione dei cerchi">
            <button class="seg-btn size-mode-btn active" data-mode="magnitudo" onclick="setSizeMode('magnitudo')">Magnitudo</button>
            <button class="seg-btn size-mode-btn" data-mode="energia" onclick="setSizeMode('energia')">Energia</button>
        </nav>
        <label for="sizepow_slider" style="display:block;margin-bottom:4px">size pow: <strong id="sizepow_val" style="color:var(--ink)">1.00</strong></label>
        <input type="range" id="sizepow_slider" min="0.2" max="1" step="0.05" value="1" style="width:100%;direction:rtl" aria-label="Esponente dimensione">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3)"><span id="sizepow_lo">1</span><span id="sizepow_hi">0.2</span></div>
    </div>

    <div style="margin:auto">

        <div id="map_div" style='max-width: 1024px;margin:auto;'></div>

        <div id="map_code_div-project" style="position:absolute;top:10px;left:10px;text-align:left;width:50%;height:800px;overflow:auto;display:none;xxbox-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);"></div>

    </div>

    <!-- ------------------------------------- -->
    <!--                                       -->
    <!-- c o d e                         -->
    <!--                                       -->
    <!-- ------------------------------------- -->

    <!--========================================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>
 
    <!--========================================================================= -->

    <script type="text/javascript" charset="utf-8">
        /** 
         ** change background color on select
         **/

        __select = (el) => {
            $(".select").removeClass("active");
            el.addClass("active");
        };
        $(".select").attr("onclick", "__select($(this))");

        // ---------------------------------------------------
        // ---------------------------------------------------
        //
        // t h e   m a p 
        //
        // ---------------------------------------------------
        // ---------------------------------------------------

        /**
         ** ************************************
         ** define the ixmaps themes and project
         ** ************************************
         **/

        var __filter = "";
        var __lat = null;
        var __lon = null;
        var __zoom = null;
        var __scale_chart = 1;
        var __legend = true;

        /**
         ** strings used by the map 	
         **/

        attribution =
            "powered by <a href=\"http://ixmaps.com\" target=\"_blank\">iXMaps</a>";

        /**
         ** get query params and adapt theme and project definitions 	
         **/

        const params = new Proxy(new URLSearchParams(window.location.search), {
            get: (searchParams, prop) => searchParams.get(prop),
        });

        if (params.filter) {
            __filter = params.filter;
        }

        if (params.view) {
            var latlonA = params.view.split('[')[1].split(']')[0].split(',');
            __lat = latlonA[0];
            __lon = latlonA[1];
            __zoom = parseFloat(params.view.split(',')[2]);
            //setTimeout("ixmaps.setView(null,"+params.view+")",1000);
        };

        if (params.scale) {
            __scale_chart = params.scale;
        };

        if (params.legend) {
            __legend = params.legend;
        };

        // ---------------------------------------------------
        // t h e   d a t a 
        // ---------------------------------------------------

        // --------------------------------------------------------------------
        // define the function to query the actual data (last week) from INGV
        // this functiuon will be loaded (toString()) into the theme definition
        // --------------------------------------------------------------------

        query = function(data, options) {

            var date = new Date();
            var uTime = date.getTime();

            /* 7 days to the past */
            uTime -= 1000 * 60 * 60 * 24 * 7;

            date = new Date(uTime);

            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var day = date.getDate();

            var szStartdate = year + "-" + String("0" + month).slice(-2) + "-" + String("0" + day).slice(-2);

            Data.feed({
                source: "https://webservices.ingv.it/fdsnws/event/1/query?starttime=" + szStartdate + "T00%3A00%3A00&minmag=1&maxmag=10&mindepth=-10&maxdepth=1000&minlat=-90&maxlat=90&minlon=-180&maxlon=180&minversion=100&orderby=time-asc&format=text&limit=10000",
                type: "csv",
            }).load(function(newData) {
                newData.addTimeColumns({
                    "source": "Time"
                });
                // energy column: log10(E[J]) = 1.5*M + 4.8 (Gutenberg-Richter)
                var iMag = newData.fields.findIndex(function(f) { return f.id == "Magnitude"; });
                newData.fields.push({ id: "Energia", typ: 0, width: 60, decimals: 0 });
                if (newData.table) { newData.table.fields = newData.fields.length; }
                newData.records.forEach(function(r) {
                    r.push(Math.pow(10, 1.5 * parseFloat(r[iMag]) + 4.8));
                });
                options.type = "jsonDB",
                    ixmaps.setExternalData(newData, options);
            });
        };


        // ----------------------------------------
        // the earthquake layer; size = magnitude or energy
        // ----------------------------------------

        var __sizeMode = "magnitudo";
        var __sizepow = { magnitudo: 1, energia: 6 };

        function quakeLayer(mode) {
            var energy = (mode == "energia");
            return (
                ixmaps.layer("World Mercator")
                .data({
                    type: "ext",
                    // insert the data query function defined above into the theme as text string
                    query: query.toString(),
                    cache: "false"
                })
                .binding({
                    value: "Depth/Km",
                    position: "Latitude|Longitude",
                    size: energy ? "Energia" : "Magnitude",
                    title: "EventLocationName"
                })
                .style({
                    type: "CHART|BUBBLE|QUANTILE|VALUES|COUNT",
                    colorscheme: [
                        "7",
                        "RGB(245,41,38)",
                        "RGB(74,74,255)",
                        "dynamic"
                    ],
                    fillopacity: "0.7",
                    shadow: "true",
                    legendunits: "km",
                    normalsizevalue: energy ? "2000000000000" : "5",
                    sizepow: String(__sizepow[mode]),
                    scale: "1",
                    timefield: "Time",
                    valuefield: "Magnitude",
                    valuescale: "1.2",
                    valuedecimals: "1",
                    showdata: "true"
                })
                .meta({
                    title: "Terremoti della ultima settimana",
                    snippet: "Il colore rappresenta la profondità mentre la grandezza " + (energy ? "l'energia (10^(1.5·M+4.8) J)" : "la magnitudine"),
                    description: "Fonte: INGV Centro Nazionale Terremoti licenza cc-by-4.0",
                    tooltip: "<h2 style='margin:0 0 0.2em 0'>{{EventLocationName}}</h2>{{theme.item.chart}}{{theme.item.data}}"
                })
                .define()
            );
        }

        // ----------------------------------------
        // create the map with DISS and earthquakes
        // 	5 layer DISS
        //  1 layer actual earthquakes
        // ----------------------------------------

        ixmaps.Map("map_div", {

                mapService: "leaflet_vt",
                mapType: "ArcGIS - Topo",
                map: "../../maps/svg/maps/generic/mercator.svg",
                legend: ((__legend == true) ? "true" : 0),
                mode: "pan",
                about: "test",
                search: "Italy",
                width: "100%",
                height: window.innerHeight + "px",
                tools: "true",
                legend: "true"

           }).then(map => (window.__map = map) && map
            
            .view([41.577354839557856, 15.468750000000002], 6)
            .options({
                featurescaling: "dynamic",
                objectscaling: "dynamic",
                normalSizeScale: "10000000",
                freezeOnPan: "false",
                hideOnPan: "false"
            })

            // DISS_3.3.0.json is a topojson with 6 layer (objects), we show 5 		 

            .layer(
                ixmaps.layer("DISS_3.3.0_1")
                .data({
                    name: "DSS330",
                    object: "DSS330",
                    url: "https://raw.githubusercontent.com/gjrichter/data/master/TopoJSON/INGV/DISS_3.3.0.json",
                    type: "topojson"
                })
                .type("FEATURES")
                .style({
                    colorscheme: ["#9FA0FF"],
                    linecolor: "#9FA0FF"
                })
                .meta({
                    title: "DSS330"
                })
                .define()
            )
            .layer(
                ixmaps.layer("DISS_3.3.0_2")
                .data({
                    name: "ISS330",
                    object: "ISS330",
                    url: "https://raw.githubusercontent.com/gjrichter/data/master/TopoJSON/INGV/DISS_3.3.0.json",
                    type: "topojson"
                })
                .type("FEATURE")
                .style({
                    colorscheme: ["none"],
                    linecolor: "#FD7A00"
                })
                .meta({
                    title: "ISS330"
                })
                .define()
            )
            .layer(
                ixmaps.layer("DISS_3.3.0_3_1")
                .data({
                    name: "CSSPLN330",
                    object: "CSSPLN330",
                    url: "https://raw.githubusercontent.com/gjrichter/data/master/TopoJSON/INGV/DISS_3.3.0.json",
                    "type": "topojson"
                })
                .type("FEATURE")
                .style({
                    colorscheme: ["#FD7A00"],
                    opacity: "0.3",
                    linecolor: "none"
                })
                .meta({
                    title: "CSSPLN330"
                })
                .define()
            )
            .layer(
                ixmaps.layer("DISS_3.3.0_3_2")
                .data({
                    name: "CSSTOP330",
                    object: "CSSTOP330",
                    url: "https://raw.githubusercontent.com/gjrichter/data/master/TopoJSON/INGV/DISS_3.3.0.json",
                    "type": "topojson"
                })
                .type("FEATURE")
                .style({
                    colorscheme: ["#FD7A00"],
                    linewidth: "0.3"
                })
                .meta({
                    title: "CSSTOP330"
                })
                .define()
            )
            .layer(
                ixmaps.layer("DISS_3.3.0_3_3")
                .data({
                    name: "SUBDCNT330",
                    object: "SUBDCNT330",
                    url: "https://raw.githubusercontent.com/gjrichter/data/master/TopoJSON/INGV/DISS_3.3.0.json",
                    type: "topojson"
                })
                .type("FEATURE")
                .style({
                    colorscheme: ["#888888"],
                    linewidth: "0.1"
                })
                .meta({
                    title: "SUBDCNT330"
                })
                .define()
            )

            // last week earthquakes 

            .layer(quakeLayer(__sizeMode))

        );


        // ----------------------------------------------
        // size pow slider (1 ... 0.2)
        // ----------------------------------------------

        $("#sizepow_slider").on("input", function() {
            var v = parseFloat(this.value);
            __sizepow[__sizeMode] = v;
            $("#sizepow_val").text(v.toFixed(2));
            try {
                ixmaps.map().changeThemeStyle("World Mercator", "sizepow:" + v, "set");
            } catch (e) { console.warn("[sizepow]", e); }
        });

        // switch the size field: magnitude <-> energy
        // the slider range follows: energy needs a stronger compression (default 6 = least contrast)
        var __powRange = {
            magnitudo: { min: 0.2, max: 1, step: 0.05 },
            energia: { min: 2, max: 6, step: 0.1 }
        };

        function setSizeMode(mode) {
            if (mode == __sizeMode) { return; }
            __sizeMode = mode;
            var r = __powRange[mode];
            $("#sizepow_slider").attr({ min: r.min, max: r.max, step: r.step }).val(__sizepow[mode]);
            $("#sizepow_val").text(__sizepow[mode].toFixed(2));
            // energy: the end of the scale is the faithful one (area ~ energy at pow 2)
            $("#sizepow_lo").text(mode == "energia" ? "compresso · " + r.max : r.max);
            $("#sizepow_hi").text(mode == "energia" ? "fedele · " + r.min : r.min);
            $(".size-mode-btn").removeClass("active");
            $(".size-mode-btn[data-mode=" + mode + "]").addClass("active");
            try {
                window.__map.replace("World Mercator", quakeLayer(mode));
            } catch (e) { console.warn("[size mode]", e); }
        }

        // ----------------------------------------------
        // window resize handling
        // ----------------------------------------------

        $(window).resize(function() {
            $("#regis_map").css("height", (window.innerHeight - 5) + "px");
        });

        // ----------------------------------------------
        // things to do on zoom and pan
        // ----------------------------------------------

        ixmaps.htmlgui_onZoomAndPan = function() {
            //var nOpacity = (ixmaps.getZoom() - 7) / 10;
            //ixmaps.setBasemapOpacity(null, nOpacity, "absolute");
        }

        // ----------------------------------------------
        // show actual map HTML page
        // ----------------------------------------------

        var fCode = false;
        const __openSidebar = (url) => {
            const $sidebar = $("#map_code_div-project");
            $sidebar.load(url, (response, status, xhr) => {
                if (status === "error") {
                    alert(`Sorry but there was an error: ${xhr.status}\n${xhr.statusText}`);
                }
            });
        };

        __dataTheme = function() {
            if (fCode) {
                $("#map_code_div-project").html("");
                $("#map_code_div-project").hide();
            } else {
                __openSidebar('../show_map_HTML.html');
                $("#map_code_div-project").show();
            }
            fCode = !fCode;
        }

    </script>

</body>

</html>
