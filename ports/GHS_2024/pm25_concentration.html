<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM2.5 concentration 2020 — glow and labels</title>
<!-- GHS_2024: update of ports/GHS/pm25_glow_labels.html on the GHS Urban Centre Database R2024A
     (shared setup: ghs2024_common.js)
     (changed: the 2015 database gave the 2014 concentration; R2024A has it for 2000-2020) -->
<script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>
<script src="ghs2024_common.js"></script>
</head>
<body>
<div id="map_div"></div>
<script>

  GHS.start({
    view: [13.068, 21.796],
    layers: [
      GHS.centres("pm25_glow", "emissions", ["EM_PM2_CON_2020"], { value: "EM_PM2_CON_2020" },
        "GLOW|CHART|BUBBLE|SIZE|AGGREGATE|MEAN",
        { colorscheme: ["7", "#F2F226", "#100050", "3colors", "#CC4878"], opacity: "0.5", fillopacity: "0.0001",
          scale: "0.5", linecolor: ["none"], valuescale: "1", valuedecimals: "0", gridwidthpx: "5" },
        { title: "PM2.5 concentration in 2020", snippet: "population weighted average, µg/m3" }),
      GHS.centres("pm25_labels", "emissions", ["EM_PM2_CON_2020", "GC_POP_TOT_2025"],
        { value: "EM_PM2_CON_2020" },
        "CHART|LABEL|QUANTILE|VALUES",
        { colorscheme: ["5", "#F2F226", "#100050", "3colors", "#CC4878"], fillopacity: "0.00001", sizefield: "GC_POP_TOT_2025", textcolor: "white", units: "µg/m3",
          rangecentervalue: "0", normalsizevalue: "10000000", scale: "1", valuescale: "1", valuedecimals: "0", maxcharts: "100" },
        { title: "PM2.5 concentration in 2020" })
    ]
  });
</script>
</body>
</html>
