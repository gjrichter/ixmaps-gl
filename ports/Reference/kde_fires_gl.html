<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KDE of the active fires (ixmaps-gl .type("KDE"))</title>
	<style>html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }</style>
</head>

<body>
	<div id="map"></div>

	<script src="../../ixmaps-gl.js"></script>

	<script>
		// the data of the flat page ports/incendi_attivi_effis_kde_regioni.html: the active fires of Italy
		// (EFFIS / NASA FIRMS), weighted by their radiative power (frp)
		var CSV_URL = "https://cdn.jsdelivr.net/gh/gjrichter/italy-fire-watch@main/italy_fires_current.csv";

		ixmaps.Map("map", {
				mapType: "VT_TONER_LITE",
				mode:    "info",
				legend:  "closed",
				tools:   true
			},
			map => map
				.view({ center: { lat: 42.5, lng: 12.5 }, zoom: 6 })
				.options({ basemapopacity: 0.7 })
				// the fires themselves, small, for reference
				.layer(ixmaps.layer("fires", l => l
					.data({ url: CSV_URL, type: "csv" })
					.binding({ position: "lat|lon", value: "frp", title: "source" })
					.type("CHART|DOT")
					.style({ colorscheme: ["#552200"], scale: 0.3, fillopacity: 0.8 })
					.meta({ name: "fires-dots", tooltip: "{{source}} — {{frp}} MW" })))
				// the density of the visible fires, weighted by frp: bands at 15 / 30 / 50 / 70 % of the maximum
				.layer(ixmaps.layer("fires-kde", l => l
					.data({ url: CSV_URL, type: "csv" })
					.binding({ position: "lat|lon", value: "frp" })
					.type("KDE")
					.style({ colorscheme: ["#dd0088"], fillopacity: 0.15 })
					.meta({ name: "fires-kde" })))
		);
	</script>
</body>

</html>
