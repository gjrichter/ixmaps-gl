<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MLHEATMAP — MapLibre's native heatmap layer (ixmaps-gl .type("MLHEATMAP"))</title>
	<style>html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }</style>
</head>

<body>
	<div id="map"></div>

	<script src="../../ixmaps-gl.js"></script>

	<script>
		// MapLibre's "Create a heatmap layer" example (earthquake frequency), as an ixmaps-gl theme:
		// weight = the magnitude (6 counts 1), the color ramp of the example, radius 20 px
		window.__ixmap = ixmaps.Map("map", {
				mapType: "VT_TONER_LITE",
				mode:    "info",
				legend:  "closed",
				tools:   true
			},
			map => map
				.view({ center: { lat: 50, lng: -120 }, zoom: 2 })
				.options({ basemapopacity: 0.7 })
				.layer(ixmaps.layer("earthquakes", l => l
					.data({ url: "https://maplibre.org/maplibre-gl-js/docs/assets/earthquakes.geojson", type: "geojson" })
					.binding({ position: "geometry", value: "mag" })
					.type("MLHEATMAP")
					.style({
						colorscheme: ["rgb(103,169,207)", "rgb(209,229,240)", "rgb(253,219,199)", "rgb(239,138,98)", "rgb(178,24,43)"],
						weightmax: 6, radiuspx: 20, intensity: 1, fillopacity: 1
					})
					.meta({ name: "earthquakes-heat" })))
		);
	</script>
</body>

</html>
