<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM2.5 concentration — glow and aggregated labels</title>
<!-- gl port of ixmaps legacy project
     iframes/ixmaps/projects/EuroStat/GHS/final/ixmaps_project_PM2.5_glow_label_population_aggregated.json
     in the style of where_people_live_equal_earth.html (shared setup: ghs_common.js) -->
<script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>
<script src="ghs_common.js"></script>
</head>
<body>
<div id="map_div"></div>
<script>

  GHS.start({
    view: [36.949, 84.990],
    layers: [
      GHS.urbanCentres("pm25_glow", { value: "E_CPM2_T14" }, "GLOW|CHART|BUBBLE|SIZE|AGGREGATE|MEAN",
        { colorscheme: ["7", "#F2F226", "#100050", "3colors", "#CC4878"], opacity: "0.5", fillopacity: "0.0001",
          scale: "0.5", linecolor: ["none"], valuescale: "1", valuedecimals: "0", gridwidthpx: "5" },
        { title: "Concentration of PM2.5 in 2014" }),
      GHS.urbanCentres("pm25_labels", { value: "E_CPM2_T14", size: "P15" }, "CHART|LABEL|TEXTONLY|GLOW|QUANTILE|VALUES|AGGREGATE|RELOCATE|MAX",
        { colorscheme: ["5", "#F2F226", "#100050", "3colors", "#CC4878"], fillopacity: "1", autoopacity: "true",
          rangecentervalue: "0", normalsizevalue: "10000000", scale: "1", valuescale: "1", valuedecimals: "1",
          maxcharts: "100", gridwidthpx: "25" },
        { title: "Concentration of PM2.5 in 2014" })
    ]
  });
</script>
</body>
</html>
