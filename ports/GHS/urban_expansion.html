<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban expansion</title>
<!-- gl port of ixmaps legacy project
     iframes/ixmaps/projects/EuroStat/GHS/final/ixmaps_project_Urban_Expansion.json
     in the style of where_people_live_equal_earth.html (shared setup: ghs_common.js) -->
<script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>
<script src="ghs_common.js"></script>
</head>
<body>
<div id="map_div"></div>
<script>

  GHS.start({
    view: [26.902, 3.4277],
    layers: [
      GHS.urbanCentres("urban_centres", { value: "AREA", value100: "H75_AREA" },
        "CHART|LOG|DIFFERENCE|RELATIVE|BUBBLE|GLOW",
        { colorscheme: ["5", "RGB(207,255,51)", "RGB(221,0,0)", "3colors", "RGB(148,204,200)"], opacity: "0.9",
          normalsizevalue: "10000", scale: "1", valuescale: "1", valuedecimals: "1" },
        { title: "Urban expansion", splash: "loading data ..." })
    ]
  });
</script>
</body>
</html>
