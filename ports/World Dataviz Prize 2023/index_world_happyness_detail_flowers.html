<!DOCTYPE html>
<html>

<!-- ************************************************************************

index_world_happyness_detail_flowers — GL port of the World Dataviz Prize
2023 original: ixmaps flat (htmlgui_api.js), winkel SVG projection

ported to the GL engine:
  - mapType "white" (the GL engine's blank background), mercator projection
  - the CHOROPLETH theme joins the CSV to the topojson countries by
    ISO code; the aggregated, gridded STARBURST theme (AGGREGATE|RECT|
    MEAN, 50px grid cells, WHERE Year = 2019) draws with the GL engine's
    starburst pie implementation — flat's XSBOW petal bowing is not ported

************************************************************************** -->

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="ixmaps embed example">
	<meta name="author" content="guenter richter">
	<link rel="shortcut icon" href="https://gjrichter.github.io/ixmaps/ui/resources/images/ixmaps_logo.png">

	<title>iXMaps really simple embed</title>
</head>

<body style='text-align:center'>

    <!--========================================================================= -->

	<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>

    <!--========================================================================= -->

	<script type="text/javascript" charset="utf-8">

		attribution =
			"<h3 style=\"margin-bottom:-2em\">powered by <a href=\"http://ixmaps.com\" target=\"_blank\">iXMaps</a></h3>";
		legend = "<h1 style='font-size:3em;font-weight:50;'>Happy Planet Index</h1><h3 style='margin-top:-1.4em;font-size:1.5em;'><i class='icon icon-radio-checked2' style='color:#A4B9D0'/> Life expectancy <i class='icon icon-radio-checked2' style='color:#CFE4F3'/> Wellbeing <i class='icon icon-radio-checked2' style='color:#F8C695'/> Ecological footprint &rarr; <i class='icon icon-radio-checked2' style='color:#ffdd22'/>  Happy Planet Index 2019 <a href='https://happyplanetindex.org/' target='_blank'>https://happyplanetindex.org/</a><h3>";

		ixmaps.Map("mymap",
				{
					mapService: "leaflet_vt",
					mapType:	"white",
					mode:		"pan",
					width:    	"100%",
					legend:     true,
					align:      "center"
				},
				map => map
				.view([13.239945499286312,23.203125000000004],2)
				.options({
						objectscaling: "dynamic",
						normalSizeScale: "10000000",
						panhidden: "false"
					})
				.attribution(attribution)
				.legend(legend)

				.layer(
					ixmaps.layer("World_countries")
					.data({
						url: "https://s3.eu-central-1.amazonaws.com/maps.ixmaps.com/topojson/CNTR_RG_10M_2020_4326.json",
						type: "topojson"
					})
					.binding({ id: "ISO3_CODE" })
					.type("FEATURE")
					.style({
						colorscheme: ["#eeeeee"],
						fillopacity: "0.7",
						linecolor: ["#888888"],
						linewidth: "0.3"
					})
					.define()
				)

				.layer(
					ixmaps.layer("World_countries")
					.data({
						name: "themeDataObj",
						url: "https://raw.githubusercontent.com/gjrichter/viz/master/World%20Dataviz%20Prize%202023/data/Dashboard_of_the_present_future.csv",
						type: "csv",
						cache: "true"
					})
					.binding({
						lookup: "ISO Country code",
						value: "happy planet index 2019",
						title: "Country"
					})
					.type("CHOROPLETH|QUANTILE|SUM|DOPACITYMAX")
					.style({
						colorscheme: [
							"7",
							"#FFDF2D",
							"#FFDF2D",
							"dynamic",
							"cold"],
						dopacitypow: "0.3",
						dopacityscale: "1",
						units: "",
						title: "happy planet index 2019"
					})
					.meta({ name: "choropleth", title: "happy planet index 2019" })
					.define()
				)

				.layer(
					ixmaps.layer("World_countries")
					.data({
						name: "themeDataObj2",
						url: "https://raw.githubusercontent.com/gjrichter/viz/refs/heads/master/World%20Dataviz%20Prize%202023/data/happy-planet-index-2006-2020-public-data-set-all.csv",
						type: "csv",
						cache: "true"
					})
					.binding({
						lookup: "ISO",
						value: "Life Expectancy (years)|Ladder of life (Wellbeing) (0-10)|Ecological Footprint (g ha)",
						title: "Country"
					})
					.filter("WHERE Year = 2019")
					.type("CHART|PIE|XLRAYS|XSBOW|STARBURST|POLAR|SIZE|BOX|TITLE|NOLEGEND|AGGREGATE|RECT|MEAN")
					.style({
						colorscheme: ["10", "tableau"],
						fillopacity: "0.5",
						shadow: "false",
						label: [
							"Life Expectancy",
							"Wellbeing",
							"Ecological Footprint"],
						units: "",
						weights: "1,10,10",
						refreshtimeout: "0",
						normalsizevalue: "100",
						scale: "0.8",
						maxvalue: "100",
						linecolor: ["#668800"],
						linewidth: "0.5",
						valuescale: "1",
						valuedecimals: "0",
						fadenegative: "1",
						centerpart: "max",
						boxopacity: "0",
						bordercolor: "none",
						evidence: "isolate_gray",
						gridwidthpx: "50",
						title: "Happy Planet Index Parameter - 2019"
					})
					.meta({ title: "Happy Planet Index Parameter - 2019" })
					.define()
				)

				.layer(
					ixmaps.layer("World_countries")
					.data({
						name: "themeDataObj3",
						url: "https://raw.githubusercontent.com/gjrichter/viz/master/World%20Dataviz%20Prize%202023/data/Dashboard_of_the_present_future.csv",
						type: "csv",
						cache: "true"
					})
					.binding({
						lookup: "ISO Country code",
						value: "happy planet index 2019",
						title: "Country"
					})
					.type("CHART|SYMBOL|LINEAR|AGGREGATE|RECT|MEAN|VALUES")
					.style({
						colorscheme: ["none"],
						fillopacity: "0.2",
						shadow: "false",
						units: "",
						textcolor: "#BB9911",
						linecolor: "none",
						linewidth: "1",
						scale: "2",
						valuedecimals: "0",
						gridwidthpx: "50",
						title: "Happy Planet Index - 2019"
					})
					.meta({ title: "Happy Planet Index - 2019" })
					.define()
				)
		);

	</script>
  </body>
</html>
