<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="ixmaps embed example">
	<meta name="author" content="guenter richter">
	<link rel="shortcut icon" href="https://gjrichter.github.io/ixmaps/ui/resources/images/ixmaps_logo.png">

	<title>iXMaps</title>
	<link rel="stylesheet"
		href="https://gjrichter.github.io/pages/assets/material-design-select-dropdown/css/style.css">
	<style>
		/* the page's attribution, bottom left: dark pill */
		.ixmaps-gl-attribution {
			background: #222222 !important;
			color: #aaaaaa !important;
		}
		.ixmaps-gl-attribution a {
			color: #dddddd !important;
		}
		/* MapLibre zoom / compass buttons: dark */
		.maplibregl-ctrl-group {
			background: #222222 !important;
			box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) !important;
		}
		.maplibregl-ctrl-group button + button {
			border-top: 1px solid #444444 !important;
		}
		.maplibregl-ctrl-group button:not(:disabled):hover {
			background-color: #3a3a3a !important;
		}
		.maplibregl-ctrl-group .maplibregl-ctrl-icon {
			filter: invert(1);
		}
		label.field .psuedo_select {
			color: white;
		}

		label.field.focused .psuedo_select ul {
			background: #222222;
		}
	</style>
</head>

<body style='text-align:center;background:#000000'>

	<div id="map_div"></div>

	<!--========================================================================= -->

	<script src="../ixmaps-gl.js"></script>

	<!--========================================================================= -->

	<script type="text/javascript" charset="utf-8">

		var attribution = "data and inspiration from: <a href='https://www.zeit.de/politik/2023-12/migration-weltweit-entwicklung-daten' target='_blank'>Zeit Online</a>, country codes: <a href='https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/World/world_country_iso_codes.csv' target='_blank'>data.ixmaps.com</a>"

		var legend = "<h1>Migration from 2015 to 2020</h1><h5 style='margin-top:-1.5em'>data and inspiration from: <a href='https://www.zeit.de/politik/2023-12/migration-weltweit-entwicklung-daten' target='_blank'>Zeit Online</a></br>(Asylantragsteller sind in den Zahlen nicht mitgerechnet)</h5>";

		var query = function (data, options) {
			var szUrl1 = "https://raw.githubusercontent.com/gjrichter/ixmaps-data/refs/heads/main/by-project/zeit-migration-2015-2020/migration_2015.topo-e0VsE90A.json";
			var szUrl2 = "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/World/world_country_iso_codes.csv";
			var broker = new Data.Broker()
				.addSource(szUrl1, "topojson")
				.addSource(szUrl2, "csv")
				.realize(
					function (dataA) {
						var data = dataA[0];
						var countries = dataA[1];
						var nameA = countries.lookupArray({
							key: "alpha-3",
							value: "name"
						});
						for (var i in nameA) {
							ixmaps.setLocalString(i, nameA[i]);
						}
						options.type = "dbtable";
						ixmaps.setExternalData(data, options);
					});
		};

		ixmaps.Map("map_div", {
			mapService: "leaflet_vt",
			mapType: "dark",
			map: "https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@1/maps/svg/maps/generic/equalearth.svg",
			width: "100%",
			height: (window.innerHeight - 20) + "px",
			legend: "true",
			mode: "info"
		})
		.view([12, 10], 2)
		.attribution(attribution)
		.legend(legend)
		.require("https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@1/ui/js/tools/tooltip_mustache.js")
		.require("https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@1/ui/js/tools/tooltip_to_action.js")
		.options({
			scrollSafeSilent: "true",
			objectscaling: "dynamic",
			normalsizescale: "10000000",
			flushChartDraw: "5000",
			panhidden: "false"
		})
		.layer(ixmaps.layer("World_countries")
			.data({
				url: "https://raw.githubusercontent.com/gjrichter/geo/main/world/ne_10m_admin_0_countries_xs.json",
				type: "topojson",
				name: "world"
			})
			.binding({
				id: "BRK_A3",
				position: "geometry"
			})
			.type("FEATURES|NOLEGEND|SILENT")
			.style({
				colorscheme: ["#222222"],
				fillopacity: "1",
				linecolor: "none",
			})
			.define()
		)
		.layer(ixmaps.layer("World_countries")
			.data({
				name: "migration_to_from",
				query: query.toString(),
				type: "ext"
			})
			.binding({
				value: "value",
				size: "value",
				position: "from",
				position2: "to"
			})
			.type("CHART|VECTOR|BEZIER|POINTER|GRADIENT|FADEIN|FAST|SUM|NOLEGEND")
			.style({
				name: "vectors",
				colorscheme: [
					"#0000dd"
				],
				markersize: 0.7,
				fillopacity: 0.9,
				sizepow: 1.5,
				normalsizevalue: 1000000,
				"linecolor": [
					"#dd3300",
					"#FBEB7C"
				]
			})
			.meta({
				title: "Migration 2015 - 2020",
				tooltip: "<h3 style='color:white;margin:0;white-space:nowrap;line-height:1.5em'><small>migration 2015-2020:</small><br><big> {{local.from}} &rarr; {{local.to}}</big><br></h3><h1 style='margin:0.1em;text-align:left;color:white'>{{theme.item.value}}</h1>"
			})
			.define()
		)
		.layer(ixmaps.layer("World_countries")
			.data({
				name: "migration_to_from",
				query: query.toString(),
				type: "ext"
			})
			.binding({
				value: "value",
				size: "value",
				position: "from"
			})
			.type("CHART|BUBBLE|SIZE|VALUES|AGGREGATE|SUM")
			.style({
				name: "departures",
				colorscheme: [
					"#ff4400"
				],
				fillopacity: 0.3,
				linecolor: "#ff4400",
				textcolor: "#ff8844",
				linewidth: "1",
				normalsizevalue: 1000000,
				visible: true
			})
			.meta({
				title: "Emigration 2015 - 2020",
				tooltip: "<h3 style='color:white;margin:0;white-space:nowrap;line-height:1.5em'><small>migration from:</small><br><big> {{from}}</big></h3><ul style='color:#888888;margin:0;padding-left:1em'><li>click to select</li><li>click on map background to undo the selection</li></ul>{{theme.item.chart}}"
			})
			.define()
		)
		.layer(ixmaps.layer("World_countries")
			.data({
				name: "migration_to_from",
				query: query.toString(),
				type: "ext"
			})
			.binding({
				value: "value",
				size: "value",
				position: "to"
			})
			.type("CHART|BUBBLE|SIZE|VALUES|AGGREGATE|SUM")
			.style({
				name: "arrivals",
				colorscheme: [
					"#FBEBAC"
				],
				fillopacity: 0.3,
				linecolor: "#FBEBAC",
				linewidth: "1",
				normalsizevalue: 1000000,
				visible: true
			})
			.meta({
				title: "Imigration 2015 - 2020",
				tooltip: "<h3 style='color:white;margin:0;white-space:nowrap;line-height:1.5em'>migration to:<br><big> {{to}}</big></h3><ul style='color:#888888;margin:0;padding-left:1em'><li>click to select</li><li>click on map background to undo the selection</li></ul>{{theme.item.chart}}"
			})
			.define()
		)

		// ----------------------------
		// U S E R   I N T E R F A C E
		// ----------------------------

		function setFilter(szField) {
			var value = this.event.target.getAttributeNS(null, "data-value");
			ixmaps.map().theme("vectors").changeStyle("filter:WHERE \"" + szField + "\" like \"" + value + "\"", "set");
			ixmaps.map().theme("arrivals").changeStyle("filter:WHERE \"" + szField + "\" like \"" + value + "\"", "set");
			ixmaps.map().theme("departures").changeStyle("filter:WHERE \"" + szField + "\" like \"" + value + "\"", "set");
			//ixmaps.showLoading("&rarr; "+value);
		}

	</script>

	<div style="position:absolute;top:0em;left:2em;color:white;z-index:1000;">
		<label id="img_category_label" class="field" for="img_category" data-value="*">
			<span style="font-size:12px;top:15px ">Migration</span>
			<div id="img_category" class="psuedo_select" name="img_category">
				<span class="selected" style="opacity:1;transform: translateY(0px); transition-duration: 0.1s;">all
					regions</span>
				<ul id="img_category_options" class="options">
					<li class="option" data-value="africa" onclick="setFilter('fromRegion')">from Africa</li>
					<li class="option" data-value="asia" onclick="setFilter('fromRegion')">from Asia</li>
					<li class="option" data-value="america" onclick="setFilter('fromRegion')">from America</li>
					<li class="option" data-value="europe" onclick="setFilter('fromRegion')">from Europe</li>
					<li class="option" data-value="europe" onclick="setFilter('toRegion')">to Europe</li>
					<li class="option" data-value="america" onclick="setFilter('toRegion')">to America</li>
					<li class="option" data-value="asia" onclick="setFilter('toRegion')">to Asia</li>
					<li class="option" data-value="africa" onclick="setFilter('toRegion')">to Africa</li>
					<li class="option" data-value="*" onclick="setFilter()">all regions</li>
				</ul>
			</div>
		</label>
	</div>

	<script src="https://gjrichter.github.io/pages/assets/material-design-select-dropdown/js/index.js"></script>

	<div style="position:absolute;top:6em;right:2em;font-family:sans-serif;color:#eeeeee">
		charts on / off
		<table>
			<tr>
				<td>
					<button
						style="background:black;color:#dddddd;border-radius:0em;border:rgb(206, 222, 239) solid 0px;padding:0.4em 0.8em;cursor:pointer"
						onclick="ixmaps.map().theme('vectors').toggle();">vectors</button>
				</td>
				<td>
					<button
						style="background:black;color:#dddddd;border-radius:0em;border:rgb(206, 222, 239) solid 0px;padding:0.4em 0.8em;cursor:pointer"
						onclick="ixmaps.map().theme('arrivals').toggle();ixmaps.map().theme('departures').toggle();">numbers</button>
				</td>
			</tr>
		</table>
	</div>

</body>

</html>
