<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referendum 22 marzo 2026 – Vincitore e percentuale per comune</title>
    <!-- ixmaps-gl port: engine swapped for the flat CDN, everything else unchanged -->
    <script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- USER chart dependencies (same as Marche map) -->
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@master/usercharts/d3/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gjrichter/ixmaps-flat@master/usercharts/d3/arrow_chart.js"></script>
    <style>
        html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e8e8e8; }
        #container { max-width: 1024px; margin: 0 auto; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        #header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(20,20,20,0.88) 0%, rgba(30,30,30,0.88) 100%);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            height: 56px;
            box-sizing: border-box;
        }
        #header h1 { color: #f0f0f0; font-size: 1.05rem; font-weight: 600; white-space: nowrap; margin: 0; }
        #header p  { color: rgba(220,220,220,0.55); font-size: 0.72rem; margin: 2px 0 0; }

        #app-loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.97);
            border-radius: 12px;
            padding: 24px 36px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #d0eaea;
            border-top-color: #00838f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        #app-loading p { color: #555; font-size: 0.88rem; margin: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #legend {
            position: absolute;
            bottom: 30px; left: 14px;
            z-index: 1000;
            background: rgba(20,20,20,0.88);
            border-radius: 10px;
            padding: 11px 14px;
            color: #e8e8e8;
            font-size: 0.72rem;
            box-shadow: 0 2px 14px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            display: none;
            min-width: 205px;
            line-height: 1.7;
        }
        #legend b { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #fff; }
        .leg-row { display: flex; align-items: center; gap: 8px; }
        .leg-bar  { height: 6px; border-radius: 3px; flex: 1; }
        .leg-sep  { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0; }

        #stats {
            position: absolute;
            bottom: 30px; right: 14px;
            z-index: 1000;
            background: rgba(20,20,20,0.88);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.75rem;
            box-shadow: 0 2px 14px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            line-height: 1.9;
            min-width: 185px;
            display: none;
        }
        #stats b { display: block; font-size: 0.8rem; color: #fff; margin-bottom: 4px; }
        .stat-row { display: flex; justify-content: space-between; gap: 12px; color: #bbb; }
        .si-val  { color: #5ac8c8; font-weight: 700; }
        .no-val  { color: #e07070; font-weight: 700; }
        .neu-val { color: #ccc;    font-weight: 700; }
        .stat-sep { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 5px 0; }

        #region-bar {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        #region-bar label {
            color: #333;
            font-size: 0.78rem;
            white-space: nowrap;
            pointer-events: none;
        }
        #region-select {
            background: rgba(20,20,20,0.72);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 6px;
            color: #f0f0f0;
            font-size: 0.82rem;
            padding: 5px 10px;
            cursor: pointer;
            outline: none;
            min-width: 170px;
            pointer-events: all;
        }
        #region-select option { background: #1e1e1e; color: #f0f0f0; }
        #region-select:hover { border-color: rgba(255,255,255,0.5); }

        /* camera orbit panel */
        #orbit-panel {
            position: absolute;
            bottom: 30px; left: 14px;
            z-index: 1001;
            background: rgba(20,20,20,0.82);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 9px 12px;
            color: #e8e8e8;
            font-size: 0.75rem;
            box-shadow: 0 2px 14px rgba(0,0,0,0.35);
            display: grid;
            grid-template-columns: auto 110px 3.6em;
            gap: 5px 8px;
            align-items: center;
        }
        #orbit-panel .btns { grid-column: 1 / -1; display: flex; gap: 6px; }
        #orbit-panel button {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 6px;
            color: #f0f0f0;
            font-size: 0.78rem;
            padding: 4px 8px;
            cursor: pointer;
        }
        #orbit-panel button:hover { border-color: rgba(255,255,255,0.5); }
        #orbit-panel input[type=range] { width: 110px; margin: 0; accent-color: #5ac8c8; }
        #orbit-panel output { text-align: right; font-variant-numeric: tabular-nums; color: #bbb; }
    </style>
</head>
<body>

<div id="container">
    <div id="region-bar">
        <label for="region-select">Regione:</label>
        <select id="region-select" onchange="changeRegion(this.value)">
            <option value="">— Tutta Italia —</option>
            <option value="1">Piemonte</option>
            <option value="2">Valle d'Aosta</option>
            <option value="3">Lombardia</option>
            <option value="4">Trentino-Alto Adige</option>
            <option value="5">Veneto</option>
            <option value="6">Friuli-Venezia Giulia</option>
            <option value="7">Liguria</option>
            <option value="8">Emilia-Romagna</option>
            <option value="9">Toscana</option>
            <option value="10">Umbria</option>
            <option value="11">Marche</option>
            <option value="12">Lazio</option>
            <option value="13">Abruzzo</option>
            <option value="14">Molise</option>
            <option value="15">Campania</option>
            <option value="16">Puglia</option>
            <option value="17">Basilicata</option>
            <option value="18">Calabria</option>
            <option value="19">Sicilia</option>
            <option value="20">Sardegna</option>
        </select>
    </div>
    <div id="map"></div>
    <div id="orbit-panel">
        <div class="btns">
            <button id="orbit-play" title="Ruota la vista attorno al centro della mappa">⟳ Orbita</button>
            <button id="orbit-reset" title="Vista dall'alto, nord in alto">Reset</button>
        </div>
        <label for="orbit-speed">Velocità</label><input id="orbit-speed" type="range" min="-30" max="30" step="1" value="8"><output id="orbit-speed-out">8°/s</output>
        <label for="orbit-tilt">Inclinazione</label><input id="orbit-tilt" type="range" min="0" max="85" step="1" value="0"><output id="orbit-tilt-out">0°</output>
    </div>
</div>

<script>
const TOPO_URL      = "https://raw.githubusercontent.com/gjrichter/geo/main/italy/boundaries/italy_istat_municipalities_4326_500m.topojson";
const DATA_URL      = "https://raw.githubusercontent.com/ondata/referendum-download/main/data/20260322/scrutini_flat.csv";
// 7 classes each (LEAD_RANGES): light = a narrow win, dark = a landslide
const SI_COLORS = ["#d6f2f2", "#a8e2e2", "#74cfcf", "#3fb5b5", "#159a9a", "#007a7a", "#004f4f"];
const NO_COLORS = ["#ffc4c4", "#f59a9a", "#e66f6f", "#d24545", "#b52525", "#8c1010", "#5c0505"];

// the CSV's percentages come as "50,90": the winner's lead over 50% per side (negative: the other won)
var processLead = function (data) {
    var iSi = data.column("perc_si").index, iNo = data.column("perc_no").index;
    var num = function (v) { return parseFloat(String(v).replace(",", ".")); };
    data.addColumn({ destination: "lead_si" }, function (row) { var v = num(row[iSi]); return isNaN(v) ? "" : v - 50; });
    data.addColumn({ destination: "lead_no" }, function (row) { var v = num(row[iNo]); return isNaN(v) ? "" : v - 50; });
    data.addColumn({ destination: "si_pct" }, function (row) { var v = num(row[iSi]); return isNaN(v) ? "" : v; });
    return data;
};

// the map's pinnacle (chart.js pinnacleChart), its height the lead over 50%; the number on the peak is
// the winner's percentage (50 + lead) instead of the lead
ixmaps.pinnacleWinChart_init = function (SVGDocument, args) { return ixmaps.pinnacleChart_init(SVGDocument, args); };
ixmaps.pinnacleWinChart = function (SVGDocument, args) {
    var r = ixmaps.pinnacleChart(SVGDocument, args);
    var v = args.value != null ? args.value : (args.values || [])[0];
    if (r !== false && isFinite(v)) {
        var title = args.item && args.item.szTitle;
        d3.select(args.target).selectAll("text").each(function () {
            if (this.textContent !== title) this.textContent = (50 + v).toFixed(1).replace(".", ",") + "%";
        });
    }
    return r;
};

// a legend peak, drawn like the map's pinnacles: a small triangle, light at the base, dark at the tip
function legendPeak(id, base, tip) {
    return "<svg width='12' height='14' viewBox='0 0 12 14' style='vertical-align:-2px;margin-right:4px'>"
        + "<defs><linearGradient id='" + id + "' x1='0' y1='1' x2='0' y2='0'>"
        + "<stop offset='0' stop-color='" + base + "'/><stop offset='1' stop-color='" + tip + "'/></linearGradient></defs>"
        + "<path d='M0.5,13.5 L6,0.5 L11.5,13.5 Z' fill='url(#" + id + ")' stroke='" + tip + "' stroke-width='0.8'/></svg>";
}
function legendKey(peak, head, color) {
    return "<span style='white-space:nowrap;margin:0 7px'>" + peak
        + "<span style='font-weight:700;color:" + color + "'>" + head + "</span></span>";
}
// the peaks' classes: the lead over 50% (percentage points), as RANGES
const LEAD_RANGES = [0, 2.5, 5, 10, 15, 20, 30, 50];
// a row of the classes' colors, with the winning % at the class breaks
function legendScale(colors) {
    return "<div style='display:flex;gap:1px'>" + colors.map(function (c) {
        return "<span style='flex:1;height:7px;background:" + c + "'></span>"; }).join("") + "</div>";
}
const LEGEND_TEXT   = [
    "<div style='text-align:center;margin:12px auto 0;max-width:270px;padding:8px 10px;background:rgba(255,255,255,0.88);border-radius:8px'>",
    "<span style='font-size:1.2em'>Referendum 22 marzo 2026</span><br>",
    "<span>Chi ha vinto in ogni comune, e con che <span style='font-weight:700'>percentuale</span></span>",
    "<div style='margin:7px 0 4px'>",
    legendKey(legendPeak("leg-si", "#c0eaea", "#005f5f"), "Vince il Sì", "#008888"),
    legendKey(legendPeak("leg-no", "#ff8888", "#880000"), "Vince il No", "#b02020"),
    "</div>",
    "<div style='width:220px;margin:0 auto 2px'>",
    legendScale(SI_COLORS), "<div style='height:2px'></div>", legendScale(NO_COLORS),
    "<div style='display:flex;justify-content:space-between;font-size:0.75em;color:#666;margin-top:1px'>",
    LEAD_RANGES.map(function (r) { return "<span>" + String(50 + r).replace(".", ",") + "</span>"; }).join(""),
    "</div></div>",
    "<div style='font-size:0.85em;color:#555;line-height:1.35;margin:4px 0 8px'>",
    "Comuni e picchi colorati per percentuale del vincitore, dal chiaro (vittoria di misura) allo scuro. ",
    "Ogni picco è alto quanto la percentuale oltre il 50%: un pareggio è piatto, un plebiscito svetta; ",
    "il numero sul picco è la percentuale del vincitore.",
    "</div>",
    "Dati: <a href='https://github.com/ondata/referendum-download' target='_blank'>ondata</a> (CC BY) · Geometrie: ISTAT",
    "</div>"
].join("");


var TOOLTIP = [
    '<b style="font-size:1.05em">{{desc_com}}</b>',
    '<br><span style="color:#999;font-size:0.88em">{{desc_prov}} · {{desc_reg}}</span>',
    '<hr style="border:none;border-top:1px solid #ddd;margin:5px 0">',
    '<table>',
    '<tr><td style="color:#888;padding:2px 4px">Sì</td>',
    '    <td style="font-weight:600;padding:2px 4px;color:#009999">{{perc_si}}%</td>',
    '    <td style="color:#aaa;font-size:0.85em;padding:2px 4px">({{voti_si}} voti)</td></tr>',
    '<tr><td style="color:#888;padding:2px 4px">No</td>',
    '    <td style="font-weight:600;padding:2px 4px;color:#c03030">{{perc_no}}%</td>',
    '    <td style="color:#aaa;font-size:0.85em;padding:2px 4px">({{voti_no}} voti)</td></tr>',
    '<tr><td style="color:#888;padding:2px 4px">Affluenza</td>',
    '    <td style="font-weight:600;padding:2px 4px">{{perc_vot}}%</td>',
    '    <td style="color:#aaa;font-size:0.85em;padding:2px 4px">({{votanti_t}}/{{elettori_t}})</td></tr>',
    '</table>'
].join("");

var REGION_VIEWS = {
    "":  { lat: 42.5,  lng: 12.5,  zoom: 6  },
    "1": { lat: 44.9,  lng: 7.9,   zoom: 8  },
    "2": { lat: 45.7,  lng: 7.3,   zoom: 9  },
    "3": { lat: 45.5,  lng: 9.7,   zoom: 8  },
    "4": { lat: 46.4,  lng: 11.1,  zoom: 8  },
    "5": { lat: 45.4,  lng: 11.9,  zoom: 8  },
    "6": { lat: 46.0,  lng: 13.2,  zoom: 8  },
    "7": { lat: 44.3,  lng: 8.7,   zoom: 9  },
    "8": { lat: 44.5,  lng: 11.3,  zoom: 8  },
    "9": { lat: 43.4,  lng: 11.1,  zoom: 8  },
    "10":{ lat: 42.9,  lng: 12.5,  zoom: 9  },
    "11":{ lat: 43.4,  lng: 13.2,  zoom: 9  },
    "12":{ lat: 41.9,  lng: 12.8,  zoom: 8  },
    "13":{ lat: 42.2,  lng: 13.7,  zoom: 9  },
    "14":{ lat: 41.6,  lng: 14.6,  zoom: 9  },
    "15":{ lat: 40.8,  lng: 14.9,  zoom: 8  },
    "16":{ lat: 40.8,  lng: 16.5,  zoom: 8  },
    "17":{ lat: 40.5,  lng: 16.0,  zoom: 9  },
    "18":{ lat: 38.9,  lng: 16.4,  zoom: 8  },
    "19":{ lat: 37.6,  lng: 14.0,  zoom: 8  },
    "20":{ lat: 40.0,  lng: 9.1,   zoom: 8  }
};

var myMap;

function changeRegion(code) {
    var THEME_NAMES = ["si_bg", "chart_si", "chart_no"];
    var filterStr = code ? "WHERE cod_reg = " + code : null;
    var v = REGION_VIEWS[code] || REGION_VIEWS[""];

    // GL port: no myMap.then — the map handle defers until the map is built
    THEME_NAMES.forEach(function(name) {
        if (filterStr) {
            ixmaps.map().changeThemeStyle(name, "filter:" + filterStr, "set");
        } else {
            ixmaps.map().changeThemeStyle(name, "filter", "remove");
        }
    });

    myMap.setView({ center: { lat: v.lat, lng: v.lng }, zoom: v.zoom });
}

function buildMap() {
    myMap = ixmaps.Map("map", {
        mapType: "VT_TONER_LITE",
        mode:    "info",
        legend:  "open",
        tools:   true
    })
    .view({ center: { lat: 42.5, lng: 12.5 }, zoom: 6 })
    .options({
        objectscaling:   "dynamic",
        normalSizeScale: "10000000",
        basemapopacity:  0,
        flushChartDraw:  1000000,
        flushPaintShape: 1000000
    });

    myMap.legend(LEGEND_TEXT);

    // ── Layer 1: contorni comunali (polygon) ──────────────────────────────
    myMap.layer("comuni")
        .data({ url: TOPO_URL, type: "topojson" })
        .binding({ geo: "geometry", id: "com_istat_code", title: "name" })
        .type("FEATURE")
        .style({
            colorscheme: ["none"],
            fillopacity: 0,
            linecolor:   "#aaaaaa",
            linewidth:   0.2,
            showdata:    "true"
        })
        .define();

    // ── Layer 2: sfondo, % Sì nelle stesse classi e colori dei picchi ─────
    //   (the peaks' classes mirrored round 50%: No's darkest at 0, Sì's at 100) — at the national view
    //   the colored comuni carry the pattern, the peaks add the relief
    myMap.layer("comuni")
        .data({ url: DATA_URL, type: "csv", process: processLead.toString(), name: "scrutini_lead" })
        .binding({ lookup: "cod_istat", value: "si_pct", title: "desc_com" })
        .type("CHOROPLETH|RANGES")

        .style({
            ranges:           LEAD_RANGES.slice().reverse().map(function (r) { return 50 - r; })
                                  .concat(LEAD_RANGES.slice(1).map(function (r) { return 50 + r; })),
            colorscheme:      NO_COLORS.slice().reverse().concat(SI_COLORS),
            fillopacity:      0.65,
            linecolor:        "#ffffff",
            linewidth:        0.15,
            showdata:         "true"
        })
        .meta({ name: "si_bg", tooltip: TOOLTIP, description: "Picchi: percentuale del vincitore oltre il 50% · Dati: ondata (CC BY) · Geometrie: ISTAT" })
        .define();

    // ── Layer 4: picchi Sì ─────────────────────────────────────────────────
    //   value: lead_si = % Sì − 50 + NONEGATIVE → solo dove Sì vince
    myMap.layer("comuni")
    .data({ url: DATA_URL, type: "csv", process: processLead.toString(), name: "scrutini_lead" })
    .binding({ lookup: "cod_istat", value: "lead_si", title: "desc_com" })
        .type("CHART|USER|3D|RANGES|AGGREGATE|RECT|RELOCATE|SUM|VALUES|NONEGATIVE|BOX|BOTTOMTITLE|NOLEGEND")

        .style({
            name:            "chart_si",
            userdraw:        "pinnacleWinChart",
            ranges:          LEAD_RANGES,
            colorscheme:     SI_COLORS,
            label:           ["Sì"],
            fillopacity:     0.95,
            linewidth:       0.1,
            sizepow:         1,
            normalsizevalue: 50,
            scale:           0.09,
            rangescale:      1.2,
            shadow:          "false",
            units:           "",
            boxcolor:        "none",
            bordercolor:     "none",
            textscale:       "0.5",
            boxupper:        "1:250000",
            textcolor:       "black",
            valuesupper:     "1:1000000",
            valuedecimals:   "1",
            minvaluesize:    "8",
            aggregationfield:"cod_istat",
            titlefield:      "desc_com",
            showdata:        "true",
            datafields:      ["desc_com","desc_prov","perc_si","perc_no","voti_si","voti_no"]
        })
        .meta({
            name:    "chart_si",
            tooltip: "<h2 style='margin:0 0 0.5em 0'>{{desc_com}}</h2>{{theme.item.chart}}<br>Sì {{perc_si}}% · No {{perc_no}}%"
        })
        .define();

    // ── Layer 5: picchi No ─────────────────────────────────────────────────
    //   value: lead_no = % No − 50 + NONEGATIVE → solo dove No vince
    myMap.layer("comuni")
        .data({ url: DATA_URL, type: "csv", process: processLead.toString(), name: "scrutini_lead" })
        .binding({ lookup: "cod_istat", value: "lead_no", title: "desc_com" })
        .type("CHART|USER|3D|RANGES|HEADTAIL|AGGREGATE|RECT|RELOCATE|SUM|VALUES|NONEGATIVE|NOLEGEND")

        .style({
            name:            "chart_no",
            userdraw:        "pinnacleWinChart",
            ranges:          LEAD_RANGES,
            colorscheme:     NO_COLORS,
            label:           ["No"],
            fillopacity:     0.95,
            sizepow:         1,
            normalsizevalue: 50,
            scale:           0.09,
            rangescale:      1.2,
            shadow:          "false",
            units:           "",
            boxcolor:        "none",
            bordercolor:     "none",
            textscale:       "0.5",
            boxupper:        "1:250000",
            textcolor:       "black",
            valuesupper:     "1:1000000",
            valuedecimals:   "1",
            minvaluesize:    "8",
            aggregationfield:"cod_istat",
            titlefield:      "desc_com",
            showdata:        "true",
            datafields:      ["desc_com","desc_prov","perc_si","perc_no","voti_si","voti_no"]
        })
        .meta({
            name:    "chart_no",
            tooltip: "<h2 style='margin:0 0 0.5em 0'>{{desc_com}}</h2>{{theme.item.chart}}<br>No {{perc_no}}% · Sì {{perc_si}}%"
        })
        .define();

    // ── Zoom dynamics (come nel Marche map) ───────────────────────────────
    // GL port: the engine has no map.on("zoomend") — flat's own
    // htmlgui_onZoomAndPan hook fires on every zoom/pan (and once on load)

    // Applied at once, not after a 500 ms debounce: the engine calls this
    // hook on 'load' before the first chart draw (and during a zoom, in
    // step with its redraws), so a delayed minvaluesize let the first draw
    // (and every draw right after a zoom or region change) show the
    // style's minvaluesize:8 labels, removed again half a second later.
    // Each value is set only when it changes — a pan alone redraws nothing.
    var _lastOpacity = null, _lastMinSize = null, _lastBg = null, _lastScale = null;
    ixmaps.htmlgui_onZoomAndPan = function() {
        var z = ixmaps.getZoom();
        var opacity = Math.max(0, Math.min(0.8, (z - 9) / 3));
        // every comune has a peak of some height here (not only the big cities): the percentages show
        // from zoom 8 on, more of them the closer the view
        var minSize = z > 10 ? 1 : z > 9 ? 15 : z > 8 ? 22 : z > 7 ? 30 : 999;
        // the colored comuni carry the national view and fade as the view closes in (0.65 at zoom 7,
        // 0.2 from zoom 10), while the peaks grow to their label-readable size
        var bg = Math.round(20 * Math.max(0.2, Math.min(0.65, 0.65 - (z - 7) * 0.15))) / 20;
        var peakScale = z > 7.5 ? 0.15 : 0.09;

        var m = ixmaps.map();
        if (opacity !== _lastOpacity) {
            _lastOpacity = opacity;
            m.setBasemapOpacity(opacity, "absolute");
        }
        if (bg !== _lastBg) {
            _lastBg = bg;
            m.changeThemeStyle("si_bg", "fillopacity:" + bg);
        }
        if (peakScale !== _lastScale) {
            _lastScale = peakScale;
            m.changeThemeStyle("chart_si", "scale:" + peakScale);
            m.changeThemeStyle("chart_no", "scale:" + peakScale);
        }
        if (minSize !== _lastMinSize) {
            _lastMinSize = minSize;
            m.changeThemeStyle("chart_si", "minvaluesize:" + minSize);
            m.changeThemeStyle("chart_no", "minvaluesize:" + minSize);
        }
    };

}

buildMap();

// ── Camera orbit: the orbit preset of the ixmaps-gl camera paths ─────────
// ixmaps.map().cameraOrbit() turns the bearing round the map center in ONE
// continuous MapLibre movement (the engine keeps its chart freeze / move
// throttle, as during a drag); it circles whatever is in the middle of the
// map (pan there first, or pick a region). A drag, scroll or touch on the
// map stops it. See camera_orbit.html, camera_path.html.
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var playBtn = $("orbit-play");
    var mapLibre = function () { return ixmaps.map().getMapLibre(); };
    var orbit = null, hooked = false;

    function syncTilt(p) {
        $("orbit-tilt").value = Math.round(p);
        $("orbit-tilt-out").value = Math.round(p) + "°";
    }
    function stop() {
        if (orbit) orbit.pause();
        playBtn.textContent = "⟳ Orbita";
    }
    function start() {
        var ml = mapLibre();
        if (!ml) return;
        if (!hooked) {
            hooked = true;
            ml.setMaxPitch(85);
            // keep the tilt slider in step with the user's own gestures
            ml.on("pitchend", function () { syncTilt(ml.getPitch()); });
        }
        // a new orbit round the map center of this moment; seen straight
        // from above an orbit is just a turning map: it tilts to 60° first
        if (orbit) orbit.destroy();
        var tilt = ml.getPitch() < 5 ? 60 : null;
        if (tilt) syncTilt(tilt);
        orbit = ixmaps.map().cameraOrbit({
            pitch: tilt, degPerSec: +$("orbit-speed").value, approach: 600,
            onPause: function () { playBtn.textContent = "⟳ Orbita"; }  // a gesture on the map
        });
        orbit.play();
        playBtn.textContent = "❚❚ Pausa";
    }

    playBtn.onclick = function () { orbit && orbit.playing ? stop() : start(); };
    $("orbit-reset").onclick = function () {
        var ml = mapLibre(); if (!ml) return;
        stop();
        ml.easeTo({ bearing: 0, pitch: 0, duration: 800 });
        syncTilt(0);
    };
    $("orbit-speed").oninput = function (e) {
        $("orbit-speed-out").value = e.target.value + "°/s";
        if (orbit) orbit.setDegPerSec(+e.target.value);
    };
    $("orbit-tilt").oninput = function (e) {
        var ml = mapLibre(); if (!ml) return;
        ml.setMaxPitch(85);
        ml.setPitch(+e.target.value);
        $("orbit-tilt-out").value = e.target.value + "°";
    };
})();

</script>
</body>
</html>
