	var setYear = function(year){
		ixmaps.map().theme(1).changeStyle("filter:WHERE Year = "+year,"set");
		ixmaps.map().theme(2).changeStyle("filter:WHERE Year = "+year,"set");
		ixmaps.map().theme(3).changeStyle("filter:WHERE Year = "+year,"set");
	}

	<div id="year_slider">
		<div class="year" id="year_label">2023</div>
		<input type="range" id="year_range" min="1951" max="2023" step="1" value="2023">
		<div class="ends"><span>1951</span><span>2023</span></div>
	</div>

	<script>
		// apply at most every 150 ms while dragging, always the last value
		(function () {
			var range = document.getElementById("year_range"), label = document.getElementById("year_label");
			var timer = null, last = 0;
			function apply() { timer = null; last = Date.now(); setYear(range.value); }
			range.addEventListener("input", function () {
				label.textContent = range.value;
				if (timer) return;
				timer = setTimeout(apply, Math.max(0, 150 - (Date.now() - last)));
			});
		})();
	</script>
