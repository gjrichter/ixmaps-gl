<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="ixmaps embed example">
	<meta name="author" content="guenter richter">
	<link rel="shortcut icon" href="https://gjrichter.github.io/ixmaps/ui/resources/images/ixmaps_logo.png">

	<title>iXMaps</title>
	<link rel="stylesheet" href="https://gjrichter.github.io/pages/assets/material-design-select-dropdown/css/style.css">
	<style>
		label.field .psuedo_select {
			color: white;
		}

		label.field.focused .psuedo_select ul {
			background: #222222;
		}

	</style>
</head>

<body style='background:#000000;text-align:center'>

	<!--========================================================================= -->

	<script src="https://cdn.jsdelivr.net/npm/ixmaps-gl@0/ixmaps-gl.js"></script>

	<!--========================================================================= -->

	<script type="text/javascript" charset="utf-8">
		var attribution = "dati: <a href='https://www.transparency.org/en/cpi/2022' target='_blank'>Transparency International</a>, 	licenza: <a href='https://creativecommons.org/licenses/by/4.0/deed.it target='_blank'>CC-BY-4.0</a>"

		ixmaps.Map("map", {
					width: "100%",
					height: (window.innerHeight - 20) + "px",
					legend: "true",
					mode: "info"
				})
				.then(map => map

				.mapType("CartoDB - Dark matter")
				//.loadMap("https://s3.eu-central-1.amazonaws.com/maps.ixmaps.com/Francia/francia_comuni_2022_bounds.svgz")
				.view([46.34872414569537, 6.398133183837974], 6.3)
				.options({
					featurescaling: "dynamic",
					objectscaling: "dynamic",
					normalSizeScale: "10000000",
					panhidden: "false",
					flushPaintShape: "1000000",
					flushChartDraw: "1000000",
					lineScaling: "0.008447027206420899",
					normalSizeScale: "177165354"
				})
				.layer(
					ixmaps.layer("COMUNI_2022")		 
						.data({
							url: "https://s3.eu-central-1.amazonaws.com/maps.ixmaps.com/Francia/francia_com2022.topojson.gz",
							type: "topojson"
						})
						.binding({
							id: "codgeo",
							position: "geometry"
						})
						.type("FEATURES|NOLEGEND")
						.style({
							colorscheme: ["none"],
							linecolor: "none",
							linewidth: "0.3",
							sizefield: "area"
						})
					.define()
					)
				.layer(
					ixmaps.layer("COMUNI_2022")
					.data({
						url: "https://s3.eu-west-1.amazonaws.com/data.ixmaps.com/ElezioniFrancia2022/resultats-par-niveau-subcom-t1-france-small.csv.gz",
						type: "csv",
						process: "function(data,options){data.column(\"Code du département\").map(function(value){if(value.match(/Z/))return(\"97\");return value;});data.addColumn({destination:\"code\"},function(row){return(row[0]+row[2])});return data;}"
					})
					.binding({
						value: "MACRON|LE PEN|MÉLENCHON",
						position: "code"
					})
					.style({
						type: "CHOROPLETH|COMPOSECOLOR|SUBTRACTIVE|DOPACITYMAX|SIMPLELEGEND",
						"colorscheme": [
							"#FFA006",
							"#0492C7",
							"#FF688D"
						],
						autoopacity: "true",
						label: [
							"E.Macron",
							"M.Le Pen",
							"J-L.Mélenchon"
						],
						units: "%",
						alphafield: "Inscrits",
						alphafield100: "$density$",
						dopacitypow: "3",
						dopacityscale: "4",
						brightness: "1.3",
						linewidth: "0.003",
						valuedecimals: "2"
					})
					.meta({
						title: "Élections présidentielle 2022 - Premier tour",
						description: "<a href='https://www.data.gouv.fr/fr/datasets/election-presidentielle-des-10-et-24-avril-2022-resultats-du-1er-tour/' target='_blank'>data.gouv.fr<a>",
						tooltip: "<h1 style='margin:-0.1em 0 0.5em 0;color:#aaaaaa'>{{Libellé de la commune}}</h1>{{theme.item.chart}}"
					})
					.define()
				)
			);

		// ----------------------------
		// U S E R   I N T E R F A C E
		// ----------------------------

	</script>

</body>

</html>
