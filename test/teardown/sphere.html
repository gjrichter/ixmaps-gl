<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>sphere backdrop and pinned tooltip</title>
<script src="../../ixmaps-gl.js"></script>
<style>html, body { margin: 0; height: 100%; } #map_div { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="map_div"></div>
<script>
  // a mercator map with a {type:"Sphere"} ocean and one clickable point at the view center
  var pts = { type: "FeatureCollection", features: [{ type: "Feature", properties: { cat: "a", name: "p" }, geometry: { type: "Point", coordinates: [9.2, 45.46] } }] };
  window._mapPromise = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_TONER_LITE", name: "sp" }, function (map) {
    return map.view([45.46, 9.2], 11)
      .layer(ixmaps.layer("ocean", function (l) {
        return l.data({ obj: { type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Sphere" }, properties: {} }] }, type: "geojson" })
          .binding({ geo: "geometry" }).type("FEATURE|NOLEGENDSILENT").style({ colorscheme: ["#123456"] }).meta({ name: "ocean" });
      }))
      .layer(ixmaps.layer("pts", function (l) {
        return l.data({ obj: pts, type: "geojson" }).binding({ geo: "geometry", value: "cat" }).type("CHART|DOT|CATEGORICAL|NOLEGEND")
          .style({ colorscheme: ["#d9534f"], values: ["a"], scale: 6 }).meta({ name: "pts", tooltip: "{{name}}" });
      }));
  });
</script>
</body>
</html>
