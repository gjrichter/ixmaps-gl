<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>runtime themes</title>
<script src="../../ixmaps-gl.js"></script>
<style>html, body { margin: 0; height: 100%; } #map_div { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="map_div"></div>
<script>
  // a one-point theme at a given longitude; meta.name is the theme id
  window.mk = function (name, lng, cat) {
    return ixmaps.layer(name, function (l) {
      return l.data({ obj: { type: "FeatureCollection", features: [{ type: "Feature", properties: { cat: cat, name: name }, geometry: { type: "Point", coordinates: [lng, 45.46] } }] }, type: "geojson" })
        .binding({ geo: "geometry", value: "cat" }).type("CHART|DOT|CATEGORICAL|NOLEGEND")
        .style({ colorscheme: ["#d9534f", "#428bca"], values: ["a", "b"], scale: 3 }).meta({ name: name, tooltip: "{{name}}" });
    });
  };
  // three points (q0:a q1:b q2:b) loaded with a .filter(), for the refreshTheme filter check
  window.mkFiltered = function (name, filter) {
    return ixmaps.layer(name, function (l) {
      return l.data({ obj: { type: "FeatureCollection", features: [[9.18, "a"], [9.20, "b"], [9.22, "b"]].map(function (r, i) {
          return { type: "Feature", properties: { cat: r[1], name: "q" + i }, geometry: { type: "Point", coordinates: [r[0], 45.44] } }; }) }, type: "geojson" })
        .binding({ geo: "geometry", value: "cat" }).type("CHART|DOT|CATEGORICAL|NOLEGEND")
        .style({ colorscheme: ["#d9534f", "#428bca"], values: ["a", "b"], scale: 3 }).meta({ name: name }).filter(filter);
    });
  };
  // three in-memory points (cats a b b) at a given latitude, no filter
  window.mkPts = function (name, lat) {
    return ixmaps.layer(name, function (l) {
      return l.data({ obj: { type: "FeatureCollection", features: [[9.18, "a"], [9.20, "b"], [9.22, "b"]].map(function (r, i) {
          return { type: "Feature", properties: { cat: r[1], name: name + i }, geometry: { type: "Point", coordinates: [r[0], lat] } }; }) }, type: "geojson" })
        .binding({ geo: "geometry", value: "cat" }).type("CHART|DOT|CATEGORICAL|NOLEGEND")
        .style({ colorscheme: ["#d9534f", "#428bca"], values: ["a", "b"], scale: 3 }).meta({ name: name });
    });
  };
  // how many of a theme's records are on the map (facet filters applied)
  window.onMapCount = function (id) { var t = ixmaps.getThemeObj(id); return t ? t.itemA.view.dbIndexA.length : -1; };
  // the names of a theme's current records (getThemeObj().objTheme: flat's dbTable)
  window.recordNames = function (id) {
    var t = ixmaps.getThemeObj(id);
    if (!t) return null;
    var db = t.objTheme, k = db.dbFields.findIndex(function (f) { return f.id === "name"; });
    return db.dbRecords.map(function (r) { return r[k]; }).sort().join(",");
  };
  // text on a label: the text field as the value (invisible in flat too) or as style.valuefield (flat's way)
  window.mkLabel = function (name, lng, bindValue, valuefield) {
    return ixmaps.layer(name, function (l) {
      return l.data({ obj: { type: "FeatureCollection", features: [{ type: "Feature", properties: { n: 3, icon: "x" }, geometry: { type: "Point", coordinates: [lng, 45.47] } }] }, type: "geojson" })
        .binding({ geo: "geometry", value: bindValue }).type("CHART|LABEL|TEXTONLY|VALUES|NOLEGEND")
        .style(valuefield ? { valuefield: valuefield, scale: 1 } : { scale: 1 }).meta({ name: name });
    });
  };
  // the chained form (no callback): myMap is the map builder, also a thenable
  window.myMap = ixmaps.Map("map_div", { mapService: "leaflet_vt", mapType: "VT_BRIGHT_LIGHT", name: "rt" }).view([45.46, 9.2], 12);
  // a base theme with one point per category, for the filter checks
  window.myMap.then(function () {
    ixmaps.map("rt").add(ixmaps.layer("base", function (l) {
      return l.data({ obj: { type: "FeatureCollection", features: [[9.18, "a"], [9.20, "b"], [9.22, "b"]].map(function (r, i) {
          return { type: "Feature", properties: { cat: r[1], name: "p" + i }, geometry: { type: "Point", coordinates: [r[0], 45.45] } }; }) }, type: "geojson" })
        .binding({ geo: "geometry", value: "cat" }).type("CHART|DOT|CATEGORICAL|NOLEGEND")
        .style({ colorscheme: ["#d9534f", "#428bca"], values: ["a", "b"], scale: 3 }).meta({ name: "base", tooltip: "{{name}}" });
    }));
  });
</script>
</body>
</html>
